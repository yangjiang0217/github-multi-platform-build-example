name: Build MultiPlatform HelloWorld (CMake)

on:
  push:
    tags:
      - 'v*'              # 打 tag 触发，例如: git tag v1.0 && git push --tags
  workflow_dispatch:      # 支持在 Actions 页面手动触发

# 关键：GITHUB_TOKEN 默认可能是只读权限，创建 Release 需要显式声明 contents: write
permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false    # 某个平台失败，不影响其他平台继续构建
      matrix:
        target:
          # Windows x86 (32位): MSVC 生成器 -A Win32
          - { name: Windows-x86,   runner: windows-latest,
              cmake_args: '-A Win32',
              src: build/Release/hello.exe,  artifact: hello-windows-x86.exe }
          # Windows x64 (64位)
          - { name: Windows-x64,   runner: windows-latest,
              cmake_args: '-A x64',
              src: build/Release/hello.exe,  artifact: hello-windows-x64.exe }
          # Windows ARM64
          - { name: Windows-ARM64, runner: windows-latest,
              cmake_args: '-A ARM64',
              src: build/Release/hello.exe,  artifact: hello-windows-arm64.exe }
          # Linux x86_64: 原生 gcc
          - { name: Linux-x86_64,  runner: ubuntu-latest,
              cmake_args: '-DCMAKE_BUILD_TYPE=Release',
              src: build/hello,               artifact: hello-linux-x86_64 }
          # Linux ARM64: 交叉编译 (toolchain 文件)
          - { name: Linux-arm64,   runner: ubuntu-latest,
              cmake_args: '-DCMAKE_TOOLCHAIN_FILE=cmake/linux-arm64-toolchain.cmake -DCMAKE_BUILD_TYPE=Release',
              src: build/hello,               artifact: hello-linux-arm64 }
          # macOS universal: x86_64 + arm64 双架构
          - { name: macOS-universal, runner: macos-latest,
              cmake_args: '-DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_BUILD_TYPE=Release',
              src: build/hello,               artifact: hello-macos-universal }

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux ARM64 cross compiler
        if: matrix.target.name == 'Linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure (CMake)
        run: cmake -B build ${{ matrix.target.cmake_args }}

      - name: Build (CMake)
        run: cmake --build build --config Release

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.target.src }}" "dist/${{ matrix.target.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: dist/${{ matrix.target.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
